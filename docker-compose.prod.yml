name: hicotea-prod
x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    environment:
      POSTGRES_DB: hicotea
      POSTGRES_USER: hicotea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hicotea -d hicotea']
      interval: 10s
      timeout: 5s
      retries: 10
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
  api:
    image: ${HICOTEA_API_IMAGE:?Define HICOTEA_API_IMAGE por SHA}
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    environment:
      HICOTEA_DATABASE_URL: postgresql+psycopg://hicotea:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@db:5432/hicotea
      HICOTEA_CODIGO_INVITACION: ${HICOTEA_CODIGO_INVITACION:?Define invitacion}
      HICOTEA_COOKIE_SECURE: "true"
      HICOTEA_ORIGENES_PERMITIDOS: '["https://hicotea.duckdns.org"]'
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    image: ${HICOTEA_WEB_IMAGE:?Define HICOTEA_WEB_IMAGE por SHA}
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    ports: ["127.0.0.1:8091:8080"]
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  pgdata:
networks:
  internal:
    driver: bridge
