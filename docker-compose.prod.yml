name: hicotea-prod
x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    environment:
      POSTGRES_DB: hicotea
      POSTGRES_USER: hicotea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U hicotea -d hicotea']
      interval: 10s
      timeout: 5s
      retries: 10
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
  api:
    image: ${HICOTEA_API_IMAGE:?Define HICOTEA_API_IMAGE por SHA}
    restart: unless-stopped
    mem_limit: 256m
    logging: *logging
    environment:
      HICOTEA_DATABASE_URL: postgresql+psycopg://hicotea:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@db:5432/hicotea
      # Código global heredado: opcional desde la migración 0010. Vacío = solo invitaciones del panel.
      HICOTEA_CODIGO_INVITACION: ${HICOTEA_CODIGO_INVITACION:-}
      HICOTEA_COOKIE_SECURE: "true"
      HICOTEA_ORIGENES_PERMITIDOS: '["https://hicotea.duckdns.org"]'
      HICOTEA_URL_PUBLICA: https://hicotea.duckdns.org
      # Correo: verificación, PIN y avisos (docs/correo-transaccional.md). "ninguno" = PIN en el log.
      # SMTP incompleto = correo deshabilitado; revisa con: exec api python -m app.cli correo estado
      HICOTEA_CORREO_MODO: ${HICOTEA_CORREO_MODO:-ninguno}
      HICOTEA_CORREO_REMITENTE: ${HICOTEA_CORREO_REMITENTE:-Hicotea <no-responder@hicotea.duckdns.org>}
      HICOTEA_SMTP_HOST: ${HICOTEA_SMTP_HOST:-}
      HICOTEA_SMTP_PUERTO: ${HICOTEA_SMTP_PUERTO:-587}
      HICOTEA_SMTP_USUARIO: ${HICOTEA_SMTP_USUARIO:-}
      HICOTEA_SMTP_CONTRASENA: ${HICOTEA_SMTP_CONTRASENA:-}
      HICOTEA_SMTP_SEGURIDAD: ${HICOTEA_SMTP_SEGURIDAD:-starttls}
      HICOTEA_SMTP_TIMEOUT: ${HICOTEA_SMTP_TIMEOUT:-15}
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    image: ${HICOTEA_WEB_IMAGE:?Define HICOTEA_WEB_IMAGE por SHA}
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    ports: ["127.0.0.1:8091:8080"]
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  pgdata:
networks:
  internal:
    driver: bridge
