<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Color de --fondo en oscuro (tema por defecto); tema.ts lo cambia al alternar a claro. -->
    <meta name="theme-color" content="#07100C" />
    <meta name="description" content="Tus ingresos, gastos y cajitas de ahorro, en orden." />
    <title>Hicotea</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar el destello oscuro→claro.
      try {
        if (localStorage.getItem('hicotea:tema') === 'claro') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
