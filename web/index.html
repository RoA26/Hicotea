<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Color de --fondo en oscuro (tema por defecto); tema.ts lo cambia al alternar a claro. -->
    <meta name="theme-color" content="#07100C" />
    <meta name="description" content="Tus ingresos, gastos y cajitas de ahorro, en orden." />
    <title>Hicotea</title>
    <script>
      // Aplica estilo, apariencia, paleta y movimiento guardados ANTES de pintar (sin destellos).
      // Debe resolver igual que normalizar() en src/tema/preferencias.ts.
      try {
        var d = document.documentElement.dataset, g = function (k) { return localStorage.getItem('hicotea:' + k) }
        var paletas = { original: ['hicotea'], natura: ['bosque', 'arena', 'terracota', 'salvia'] }
        var estilo = paletas[g('estilo')] ? g('estilo') : 'original'
        var tema = g('tema'), mq = function (q) { return window.matchMedia && window.matchMedia(q).matches }
        if (tema === 'claro' || (tema === 'sistema' && !mq('(prefers-color-scheme: dark)'))) d.theme = 'light'
        if (estilo !== 'original') d.estilo = estilo
        d.paleta = paletas[estilo].indexOf(g('paleta')) >= 0 ? g('paleta') : paletas[estilo][0]
        var mov = g('movimiento')
        d.movimiento = mq('(prefers-reduced-motion: reduce)') ? 'reducido' : mov === 'sutil' || mov === 'reducido' ? mov : 'completo'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
